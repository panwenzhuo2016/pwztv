name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4 # 这里建议也升级到 v4

    - name: set up JDK 17
      uses: actions/setup-java@v4 # 这里建议也升级到 v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4 # 重点修改这里：v3 -> v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
