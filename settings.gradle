pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        google()
        flatDir { dirs "$rootDir/app/libs" }
        maven { url "https://jitpack.io" }
        maven {
            url "http://4thline.org/m2"
            allowInsecureProtocol = true
        }
    }
}
include ':app'
include ':catvod'
def withPython = providers.gradleProperty('withPython').orElse('false').get()
if (!(withPython in ['true', 'false'])) throw new GradleException('withPython must be true or false')
if (withPython.toBoolean()) include ':chaquo'
include ':quickjs'
rootProject.name = "TV"
